<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Najeeb Ullah — Mobile Game Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;700&family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&family=Outfit:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B14;--surface:#14142A;--text:#ECECF8;--primary:#7C5CFF;--accent:#22D3EE;--on-primary:#fff;
  --surface-2:color-mix(in srgb,var(--surface) 90%,var(--text) 10%);
  --border:color-mix(in srgb,var(--text) 12%,transparent);
  --muted:color-mix(in srgb,var(--text) 64%,var(--bg));
  --radius:18px;--font-head:'Sora',sans-serif;--font-body:'Inter',sans-serif;
  --grad:linear-gradient(120deg,var(--primary),var(--accent));
  --shadow:0 20px 50px -20px color-mix(in srgb,var(--primary) 45%,transparent);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s,color .4s}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.15;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
img{max-width:100%;display:block}
.container{width:min(1200px,100% - 48px);margin-inline:auto}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
body.fx-grid::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%)}
main,nav,footer{position:relative;z-index:1}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none;z-index:0}

/* NAV */
.nav{position:fixed;top:14px;left:0;right:0;z-index:50}
.nav-inner{display:flex;align-items:center;gap:16px;padding:10px 12px 10px 20px;border:1px solid var(--border);border-radius:999px;
  background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:800;font-size:1.05rem;cursor:pointer}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:var(--on-primary);font-size:.8rem;font-weight:800}
.nav-links{display:flex;gap:4px;margin-left:auto}
.nav-links a{padding:8px 14px;border-radius:999px;font-size:.92rem;color:var(--muted);cursor:pointer;transition:.2s}
.nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--surface-2)}
.nav-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;transition:.2s}
.icon-btn:hover{border-color:var(--primary);color:var(--primary)}
.icon-btn svg{width:18px;height:18px}
.burger{display:none}
@media(max-width:900px){
  .nav-links{position:absolute;top:64px;left:0;right:0;flex-direction:column;padding:12px;border-radius:20px;border:1px solid var(--border);
    background:var(--surface);display:none}
  .nav-links.open{display:flex}
  .nav-actions{margin-left:auto}
  .burger{display:grid}
}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;font-weight:600;font-size:.95rem;cursor:pointer;border:1px solid transparent;transition:transform .2s,box-shadow .2s,background .2s}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--grad);color:var(--on-primary);box-shadow:var(--shadow)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{border-color:var(--border);background:var(--surface)}
.btn-ghost:hover{border-color:var(--primary)}
.btn-sm{padding:8px 14px;font-size:.85rem}

/* SECTIONS */
section{padding:110px 0;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--primary)}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--grad);border-radius:2px}
.sec-head{max-width:640px;margin-bottom:56px}
.sec-head h2{font-size:clamp(2rem,4vw,3rem);margin:14px 0 14px}
.sec-head p{color:var(--muted);font-size:1.05rem}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}

/* REVEAL */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
body.no-anim .reveal{opacity:1;transform:none;transition:none}
body.no-anim *{animation:none!important}

/* HERO */
.hero{min-height:100vh;display:flex;align-items:center;padding-top:140px}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:60px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:.85rem;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 4px color-mix(in srgb,#22C55E 25%,transparent);animation:pulse 2s infinite}
.dot.off{background:#F59E0B;box-shadow:0 0 0 4px color-mix(in srgb,#F59E0B 25%,transparent)}
@keyframes pulse{50%{box-shadow:0 0 0 8px transparent}}
.hero h1{font-size:clamp(2.6rem,6.2vw,5.2rem);font-weight:800;margin:22px 0 10px}
.hero .role{font-family:var(--font-head);font-size:clamp(1.2rem,2.4vw,1.7rem);font-weight:600;color:var(--muted);margin-bottom:20px}
.hero .tagline{font-size:1.12rem;color:var(--muted);max-width:540px;margin-bottom:34px}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
.socials{display:flex;gap:10px;margin-top:36px;flex-wrap:wrap}
.socials a{padding:8px 14px;border-radius:999px;border:1px solid var(--border);font-size:.85rem;color:var(--muted);transition:.2s}
.socials a:hover{color:var(--text);border-color:var(--primary)}
.hero-visual{position:relative;aspect-ratio:1/1.05;max-width:440px;justify-self:center;width:100%}
.avatar-frame{position:absolute;inset:8% 6%;border-radius:calc(var(--radius) * 2);padding:3px;background:var(--grad);transform:rotate(-3deg);box-shadow:var(--shadow)}
.avatar-inner{width:100%;height:100%;border-radius:calc(var(--radius) * 2 - 3px);background:var(--surface);overflow:hidden;display:grid;place-items:center;transform:rotate(3deg) scale(1.02)}
.avatar-inner img{width:100%;height:100%;object-fit:cover}
.initials{font-family:var(--font-head);font-weight:800;font-size:7rem}
.float-chip{position:absolute;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:16px;background:color-mix(in srgb,var(--surface) 85%,transparent);
  border:1px solid var(--border);backdrop-filter:blur(10px);font-size:.85rem;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);animation:bob 5s ease-in-out infinite}
.float-chip .ico{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:var(--on-primary)}
.float-chip .ico svg{width:16px;height:16px}
.float-chip small{display:block;color:var(--muted);font-weight:500;font-size:.72rem}
.chip-1{top:4%;left:-6%}.chip-2{bottom:16%;right:-8%;animation-delay:-2s}.chip-3{bottom:-2%;left:4%;animation-delay:-3.5s}
@keyframes bob{50%{transform:translateY(-12px)}}
.scroll-cue{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:8px}
.scroll-cue span{width:22px;height:36px;border:2px solid var(--border);border-radius:12px;position:relative}
.scroll-cue span::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:8px;border-radius:2px;background:var(--primary);transform:translateX(-50%);animation:wheel 1.8s infinite}
@keyframes wheel{to{transform:translate(-50%,12px);opacity:0}}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}.hero-visual{max-width:340px;order:-1}.scroll-cue{display:none}}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:28px}
.about-text{padding:40px}
.about-text p{color:var(--muted);font-size:1.05rem;white-space:pre-line}
.about-meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px}
.meta{padding:14px 16px;border-radius:14px;background:var(--surface-2)}
.meta small{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em}
.meta div{font-weight:600}
.stats{display:grid;gap:16px}
.stat{padding:26px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;transition:.3s}
.stat:hover{border-color:var(--primary);transform:translateX(4px)}
.stat b{font-family:var(--font-head);font-size:2.3rem;font-weight:800}
.stat span{color:var(--muted);text-align:right}
@media(max-width:900px){.about-grid{grid-template-columns:1fr}.about-text{padding:28px}}

/* SKILLS */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.skill-cat{padding:28px}
.skill-cat h3{font-size:1.05rem;margin-bottom:22px;display:flex;align-items:center;gap:10px}
.skill-cat h3 i{width:10px;height:10px;border-radius:3px;background:var(--grad)}
.skill{margin-bottom:18px}
.skill:last-child{margin-bottom:0}
.skill-top{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:8px}
.skill-top span{color:var(--muted)}
.bar{height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--grad);transition:width 1.4s cubic-bezier(.2,.7,.2,1) .2s}
.reveal.in .bar i,body.no-anim .bar i{width:var(--w)}

/* PROJECTS */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:34px}
.filter{padding:9px 18px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:.9rem;color:var(--muted);transition:.2s}
.filter.active,.filter:hover{color:var(--on-primary);background:var(--grad);border-color:transparent}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.proj{overflow:hidden;cursor:pointer;transition:transform .35s,box-shadow .35s,border-color .35s;display:flex;flex-direction:column}
.proj:hover{transform:translateY(-8px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--primary) 50%,transparent)}
.cover{aspect-ratio:16/10;position:relative;overflow:hidden;background:var(--surface-2)}
.cover svg,.cover img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.proj:hover .cover svg,.proj:hover .cover img{transform:scale(1.06)}
.badge{position:absolute;top:14px;left:14px;padding:5px 11px;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.05em;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(8px);border:1px solid var(--border)}
.badge.feat{left:auto;right:14px;background:var(--grad);color:var(--on-primary);border:0}
.proj-body{padding:22px 24px 24px;display:flex;flex-direction:column;flex:1}
.proj-body h3{font-size:1.3rem;margin-bottom:8px}
.proj-body p{color:var(--muted);font-size:.94rem;margin-bottom:18px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:4px 10px;border-radius:8px;font-size:.75rem;background:var(--surface-2);color:var(--muted)}
.proj-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);font-size:.85rem;color:var(--muted)}
.proj-foot b{color:var(--primary);font-weight:600;display:flex;align-items:center;gap:6px}
.empty{padding:50px;text-align:center;color:var(--muted)}

/* EXPERIENCE */
.timeline{position:relative;max-width:820px}
.timeline::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--primary),var(--accent),transparent)}
.tl-item{position:relative;padding-left:52px;margin-bottom:26px}
.tl-item::before{content:"";position:absolute;left:3px;top:26px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:3px solid var(--primary)}
.tl-card{padding:24px 28px}
.tl-card .period{font-size:.8rem;font-weight:700;color:var(--primary);letter-spacing:.06em;text-transform:uppercase}
.tl-card h3{font-size:1.2rem;margin:6px 0 2px}
.tl-card .co{color:var(--muted);font-weight:500;margin-bottom:10px}
.tl-card p{color:var(--muted);font-size:.95rem;white-space:pre-line}

/* SERVICES */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.svc{padding:30px;transition:.3s;position:relative;overflow:hidden}
.svc::after{content:"";position:absolute;inset:auto -40% -60% auto;width:200px;height:200px;border-radius:50%;background:var(--grad);opacity:0;filter:blur(60px);transition:.4s}
.svc:hover{border-color:color-mix(in srgb,var(--primary) 50%,transparent);transform:translateY(-4px)}
.svc:hover::after{opacity:.35}
.svc-ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;margin-bottom:20px;
  background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary)}
.svc-ico svg{width:24px;height:24px}
.svc h3{font-size:1.15rem;margin-bottom:8px}
.svc p{color:var(--muted);font-size:.95rem}

/* CONTACT */
.contact-wrap{padding:48px;display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;position:relative;overflow:hidden}
.contact-wrap h2{font-size:clamp(2rem,4vw,2.8rem);margin:14px 0}
.contact-wrap > div > p{color:var(--muted)}
.c-list{display:grid;gap:12px;margin-top:28px}
.c-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--surface-2)}
.c-item .svc-ico{width:42px;height:42px;margin:0;border-radius:12px}
.c-item .svc-ico svg{width:19px;height:19px}
.c-item small{display:block;color:var(--muted);font-size:.75rem}
.c-item div:last-child{flex:1;min-width:0;word-break:break-word}
.form{display:grid;gap:14px;position:relative;z-index:1}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:500}
.input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--border);background:var(--bg);outline:none;transition:.2s}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 18%,transparent)}
textarea.input{resize:vertical;min-height:130px}
.form-ok{padding:14px 16px;border-radius:12px;background:color-mix(in srgb,#22C55E 14%,transparent);color:#22C55E;font-size:.9rem;display:none}
@media(max-width:900px){.contact-wrap{grid-template-columns:1fr;padding:28px}.form .row{grid-template-columns:1fr}}

footer{padding:40px 0 50px;border-top:1px solid var(--border);color:var(--muted);font-size:.9rem}
.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.foot a{cursor:pointer}
.foot a:hover{color:var(--text)}

/* MODAL */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{width:min(820px,100%);max-height:90vh;overflow:auto;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.95) translateY(10px);opacity:0}}
.modal .cover{aspect-ratio:16/8}
.modal-body{padding:30px 34px 34px}
.modal-body h2{font-size:2rem;margin-bottom:6px}
.modal-body .desc{color:var(--muted);margin:16px 0 24px;white-space:pre-line}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.modal-x{position:absolute;top:14px;right:14px;z-index:2}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);z-index:200;padding:12px 20px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:600;font-size:.9rem;transition:.35s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%)}

/* ======== CMS ======== */
.cms-fab{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;align-items:center;gap:10px;padding:13px 20px;border-radius:999px;background:var(--grad);color:var(--on-primary);font-weight:700;cursor:pointer;border:0;box-shadow:var(--shadow);transition:.2s}
.cms-fab:hover{transform:translateY(-2px) scale(1.02)}
.cms-fab svg{width:18px;height:18px;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cms-fab.hidden{display:none}
.cms-scrim{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.3s}
.cms-scrim.show{opacity:1;pointer-events:auto}
.cms{position:fixed;top:0;right:0;height:100vh;height:100dvh;width:min(600px,100vw);z-index:100;background:var(--bg);border-left:1px solid var(--border);
  transform:translateX(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);display:grid;grid-template-columns:76px 1fr;grid-template-rows:auto 1fr;box-shadow:-30px 0 60px -20px rgba(0,0,0,.5)}
.cms.open{transform:none}
.cms-top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border);background:var(--surface)}
.cms-top h3{font-size:1rem}
.cms-top small{color:var(--muted);font-size:.78rem;display:block;font-family:var(--font-body);font-weight:400}
.cms-top .saved{margin-left:auto;font-size:.75rem;color:#22C55E;display:flex;align-items:center;gap:6px}
.cms-tabs{border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:4px;overflow:auto;background:var(--surface)}
.cms-tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;cursor:pointer;font-size:.66rem;font-weight:600;color:var(--muted);border:0;background:none;transition:.2s}
.cms-tab svg{width:20px;height:20px}
.cms-tab:hover{background:var(--surface-2);color:var(--text)}
.cms-tab.active{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
.cms-body{overflow:auto;padding:24px 22px 60px}
.cms-body h4{font-size:1.15rem;margin-bottom:4px}
.cms-body .hint{color:var(--muted);font-size:.84rem;margin-bottom:20px}
.cms-group{margin-bottom:26px}
.cms-group > label,.cms-label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.f{margin-bottom:14px}
.f label{display:block;font-size:.8rem;font-weight:600;margin-bottom:6px;color:var(--muted)}
.f .input{padding:10px 13px;border-radius:10px;font-size:.92rem}
.f textarea.input{min-height:90px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.preset{padding:10px;border-radius:14px;border:2px solid var(--border);cursor:pointer;transition:.2s;background:none;text-align:left}
.preset:hover{transform:translateY(-2px)}
.preset.active{border-color:var(--primary)}
.preset .pv{height:54px;border-radius:9px;margin-bottom:8px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:7px;gap:4px}
.preset .pv i{width:14px;height:14px;border-radius:50%;display:block}
.preset .pv b{position:absolute;top:8px;left:8px;right:8px;height:6px;border-radius:4px}
.preset .pn{font-size:.78rem;font-weight:700}
.preset .pm{font-size:.68rem;color:var(--muted)}
.colors{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.cpick{text-align:center;font-size:.7rem;color:var(--muted)}
.cpick input{width:100%;height:44px;border-radius:12px;border:1px solid var(--border);background:none;cursor:pointer;padding:3px}
.seg{display:flex;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--border);gap:4px}
.seg button{flex:1;padding:8px;border-radius:9px;border:0;background:none;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button.active{background:var(--grad);color:var(--on-primary)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px;font-size:.9rem;gap:10px}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--surface-2);cursor:pointer;transition:.2s;border:1px solid var(--border)}
.switch span::after{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;border-radius:50%;background:var(--text);transition:.2s}
.switch input:checked + span{background:var(--primary)}
.switch input:checked + span::after{transform:translateX(18px);background:var(--on-primary)}
input[type=range]{width:100%;accent-color:var(--primary)}
.item{border:1px solid var(--border);border-radius:14px;margin-bottom:10px;background:var(--surface);overflow:hidden}
.item-head{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;cursor:pointer;user-select:none}
.item-head .t{flex:1;font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-head .chev{transition:.2s;color:var(--muted)}
.item.open .chev{transform:rotate(90deg)}
.item-body{display:none;padding:4px 14px 14px;border-top:1px solid var(--border)}
.item.open .item-body{display:block;padding-top:14px}
.mini{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:none}
.mini:hover{color:var(--text);border-color:var(--primary)}
.mini.del:hover{color:#EF4444;border-color:#EF4444}
.mini svg{width:14px;height:14px}
.add-btn{width:100%;padding:12px;border-radius:12px;border:1.5px dashed var(--border);background:none;cursor:pointer;color:var(--muted);font-weight:600;transition:.2s}
.add-btn:hover{border-color:var(--primary);color:var(--primary)}
.img-field{display:flex;gap:12px;align-items:center}
.img-thumb{width:64px;height:64px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;flex:none;display:grid;place-items:center;font-size:.65rem;color:var(--muted)}
.img-thumb img{width:100%;height:100%;object-fit:cover}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sec-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px}
.sec-row .t{flex:1;font-weight:600;font-size:.92rem}
.note{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,transparent);font-size:.82rem;color:var(--text);margin-bottom:16px;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.msg{padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);margin-bottom:10px;font-size:.88rem}
.msg .mh{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.msg small{color:var(--muted)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.75rem;min-height:180px}
.danger{color:#EF4444;border-color:color-mix(in srgb,#EF4444 40%,transparent)}
@media(max-width:560px){.cms{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}.cms-tabs{flex-direction:row;border-right:0;border-bottom:1px solid var(--border)}.cms-tab{min-width:60px}.presets{grid-template-columns:repeat(2,1fr)}.colors{grid-template-columns:repeat(3,1fr)}}
</style>

function lum(hex){const n=parseInt(hex.slice(1),16);const r=(n>>16)/255,g=(n>>8&255)/255,b=(n&255)/255;
  const f=c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4);return .2126*f(r)+.7152*f(g)+.0722*f(b)}
function themeColors(){const p=PRESETS[state.theme.preset]||PRESETS.neon;return {...p,...state.theme.overrides}}
function applyTheme(){
  const t=state.theme,c=themeColors(),r=document.documentElement.style,f=FONTS[t.font]||FONTS.sora;
  ['bg','surface','text','primary','accent'].forEach(k=>r.setProperty('--'+k,c[k]));
  r.setProperty('--on-primary',lum(c.primary)>.45?'#0B0B10':'#FFFFFF');
  r.setProperty('--radius',t.radius+'px');
  r.setProperty('--font-head',f.head);r.setProperty('--font-body',f.body);
  document.body.classList.toggle('no-anim',!t.animations||matchMedia('(prefers-reduced-motion: reduce)').matches);
  document.body.classList.toggle('fx-grid',t.effect==='grid');
  document.getElementById('fab').classList.toggle('hidden',!t.showFab);
  fx.colors=[c.primary,c.accent,c.text];fx.on=t.effect==='stars';
}

    <circle cx="0" cy="0" r="32" fill="#F4F6FB"/><ellipse cx="2" cy="2" rx="22" ry="17" style="fill:color-mix(in srgb,var(--primary) 70%,#000)"/><ellipse cx="-6" cy="-4" rx="7" ry="4" fill="#fff" opacity=".6"/>
    <rect x="-12" y="34" width="24" height="12" rx="3" style="fill:var(--accent)"/></g>
    <circle cx="60" cy="210" r="14" fill="#fff" opacity=".08"/><path d="M200 230 Q 260 200 330 220" style="stroke:var(--accent)" stroke-width="2" fill="none" opacity=".4" stroke-dasharray="4 6"/>`;
  }else if(p.coverStyle==='battle'){
    let grid='';for(let x=0;x<=400;x+=25)grid+=`<line x1="${x}" y1="0" x2="${x}" y2="250" stroke="#fff" opacity=".05"/>`;for(let y=0;y<=250;y+=25)grid+=`<line x1="0" y1="${y}" x2="400" y2="${y}" stroke="#fff" opacity=".05"/>`;

let io;
function observe(){
  io?.disconnect();const els=document.querySelectorAll('.reveal');
  if(!firstRender||document.body.classList.contains('no-anim')){els.forEach(e=>e.classList.add('in'));if(!firstRender)return}
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
  els.forEach(e=>io.observe(e));
}
function spy(){const links=document.querySelectorAll('.nav-links a');let cur='';
  state.sections.forEach(s=>{const el=document.getElementById('sec-'+s.id);if(el&&el.getBoundingClientRect().top<innerHeight*.4)cur=s.id});
  links.forEach(a=>a.classList.toggle('active',a.dataset.goto===cur))}

function fieldHTML(path,key,label,type='text',opts,val){
  const a=`data-path="${path}" data-key="${key}" data-type="${type}"`;
  if(type==='textarea')return `<div class="f"><label>${label}</label><textarea class="input" ${a}>${esc(val)}</textarea></div>`;
  if(type==='select')return `<div class="f"><label>${label}</label><select class="input" ${a}>${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select></div>`;
  if(type==='check')return `<div class="toggle-row">${label}<label class="switch"><input type="checkbox" ${a} ${val?'checked':''}><span></span></label></div>`;
  if(type==='range')return `<div class="f"><label>${label}: <b data-out="${path}.${key}">${val}</b></label><input type="range" min="0" max="100" value="${+val||0}" ${a}></div>`;
  if(type==='image')return `<div class="f"><label>${label}</label><div class="img-field"><div class="img-thumb">${val?`<img src="${val}">`:'None'}</div>
    <span class="btn btn-ghost btn-sm file-btn">Upload<input type="file" accept="image/*" ${a}></span>${val?`<button class="btn btn-ghost btn-sm" data-act="img-clear" data-path="${path}" data-key="${key}">Remove</button>`:''}</div></div>`;
  return `<div class="f"><label>${label}</label><input class="input" type="${type==='url'?'url':'text'}" ${a} value="${esc(type==='tags'?(val||[]).join(', '):val)}"></div>`;
}

    <div class="cms-group"><label>Identity</label>${pf('avatar','Profile photo','image')}<div class="f2">${pf('name','Full name')}${pf('role','Role / title')}</div>${pf('tagline','Hero tagline','textarea')}${pf('bio','About me','textarea')}</div>
    <div class="cms-group"><label>Contact & status</label><div class="f2">${pf('email','Email')}${pf('location','Location')}</div>${pf('availability','Availability text')}${pf('heroBadge','Hero badge text')}${pf('available','Available for work (green dot)','check')}</div>
    <div class="cms-group"><label>Social links</label>${listEditor('socials')}</div>
    <div class="cms-group"><label>About stats</label>${listEditor('stats')}</div>
    <div class="cms-group"><label>Section headings</label>${cf('aboutTitle','About heading')}${cf('projectsTitle','Games heading')}${cf('projectsSub','Games subtitle','textarea')}${cf('skillsTitle','Skills heading')}${cf('skillsSub','Skills subtitle')}${cf('expTitle','Experience heading')}${cf('servicesTitle','Services heading')}${cf('servicesSub','Services subtitle')}${cf('contactTitle','Contact heading')}${cf('contactSub','Contact subtitle','textarea')}</div>`;
  }else if(SCHEMA[cmsTab]){
    const meta={projects:['Games & projects','Add, edit, reorder or remove games. Upload a screenshot as the cover, or keep the generated art that follows your theme colors.'],
      skills:['Skills','Skills are grouped into cards by category.'],experience:['Career timeline','Jobs, freelance work, education or game jams.'],services:['Services','What clients can hire you for.']}[cmsTab];
    h=`<h4>${meta[0]}</h4><p class="hint">${meta[1]}</p>${listEditor(cmsTab)}`;
  }else if(cmsTab==='sections'){
    h=`<h4>Layout & sections</h4><p class="hint">Show, hide and reorder sections. Rename them to change the menu labels.</p>
    ${state.sections.map((s,i)=>`<div class="sec-row">${s.locked?'<span class="mini" style="cursor:default">🔒</span>':`<button class="mini" data-act="smove" data-i="${i}" data-d="-1">${ic('up')}</button><button class="mini" data-act="smove" data-i="${i}" data-d="1">${ic('down')}</button>`}
    <input class="input t" style="padding:7px 10px;border-radius:8px" value="${esc(s.label)}" data-slabel="${i}" ${s.locked?'disabled':''}>
    ${s.locked?'':`<label class="switch"><input type="checkbox" data-svis="${i}" ${s.visible?'checked':''}><span></span></label>`}</div>`).join('')}`;
  }else if(cmsTab==='inbox'){
    h=`<h4>Inbox</h4><p class="hint">Messages sent through the contact form.</p>
    <div class="note">In this preview, messages are stored only in this browser. When the site goes live, connect the form to a service like Formspree, EmailJS or a small backend so messages reach your email.</div>
    ${state.inbox.length?state.inbox.map((m,i)=>`<div class="msg"><div class="mh"><b>${esc(m.name)} <small>· ${esc(m.type||'')}</small></b><button class="mini del" data-act="msg-del" data-i="${i}">${ic('trash')}</button></div>
    <small>${esc(m.email)} · ${esc(m.date)}</small><p style="margin-top:8px;white-space:pre-line">${esc(m.message)}</p></div>`).join(''):'<div class="empty card">No messages yet.</div>'}`;
  }else if(cmsTab==='data'){
    h=`<h4>Backup & restore</h4><p class="hint">All content and theme settings as one JSON file. Copy it to back up or move to another device, or paste a backup to restore.</p>
    <div class="note">Edits are saved in this browser. To publish them for everyone, copy this JSON and load it as the site's content file when deploying.</div>
    <div class="cms-group"><label>Export</label><textarea class="input code" id="exp" readonly>${esc(JSON.stringify({...state,inbox:[]},null,2))}</textarea>
    <button class="btn btn-primary btn-sm" style="margin-top:10px" data-act="export">${ic('copy')} Copy JSON</button></div>
    <div class="cms-group"><label>Import</label><textarea class="input code" id="imp" placeholder="Paste exported JSON here..."></textarea>
    <button class="btn btn-ghost btn-sm" style="margin-top:10px" data-act="import">Apply import</button></div>
    <div class="cms-group"><label>Danger zone</label><button class="btn btn-ghost btn-sm danger" data-act="reset-all" id="resetBtn">Reset everything to defaults</button></div>`;
  }
  B.innerHTML=h;
}
function openCMS(){renderCMS();document.getElementById('cms').classList.add('open');document.getElementById('scrim').classList.add('show')}
function closeCMS(){document.getElementById('cms').classList.remove('open');document.getElementById('scrim').classList.remove('show')}

function getObj(path){const [a,b]=path.split('.');return b===undefined?state[a]:state[a][+b]}
function setField(el){
  const obj=getObj(el.dataset.path),k=el.dataset.key,t=el.dataset.type;
  if(t==='check')obj[k]=el.checked;else if(t==='tags')obj[k]=el.value.split(',').map(s=>s.trim()).filter(Boolean);
  else if(t==='range'){obj[k]=+el.value;const o=document.querySelector(`[data-out="${el.dataset.path}.${k}"]`);if(o)o.textContent=el.value}
  else obj[k]=el.value;
  const [list,i]=el.dataset.path.split('.');
  if(SCHEMA[list]&&i!==undefined){const l=document.querySelector(`[data-lbl="${list}:${i}"]`);if(l)l.textContent=SCHEMA[list].label(obj)}
  save();scheduleRender();
}
function readImage(file,max=1200){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
  const s=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.85))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

/* ================= EVENTS ================= */
document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-goto]');
  if(g){e.preventDefault();document.getElementById('sec-'+g.dataset.goto)?.scrollIntoView({behavior:'smooth'});document.getElementById('navLinks')?.classList.remove('open');return}
  const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}
  const pr=e.target.closest('[data-proj]');if(pr){openProject(pr.dataset.proj);return}
  const tab=e.target.closest('[data-tab]');if(tab){cmsTab=tab.dataset.tab;renderCMS();document.getElementById('cmsBody').scrollTop=0;return}
  const ps=e.target.closest('[data-preset]');if(ps){state.theme.preset=ps.dataset.preset;state.theme.overrides={};applyTheme();save();render();renderCMS();return}
  const ef=e.target.closest('[data-effect]');if(ef){state.theme.effect=ef.dataset.effect;applyTheme();save();renderCMS();return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='cms-open')openCMS();
  else if(act==='cms-close')closeCMS();
  else if(act==='modal-close')closeModal();
  else if(act==='burger')document.getElementById('navLinks').classList.toggle('open');
  else if(act==='cycle-theme'){const ks=Object.keys(PRESETS);state.theme.preset=ks[(ks.indexOf(state.theme.preset)+1)%ks.length];state.theme.overrides={};applyTheme();save();render();if(cmsTab==='theme')renderCMS();toast('Theme: '+PRESETS[state.theme.preset].name)}
  else if(act==='toggle-mode'){const cur=themeColors().mode,ks=Object.keys(PRESETS);const next=ks.find(k=>PRESETS[k].mode!==cur);state.theme.preset=next;state.theme.overrides={};applyTheme();save();render();if(cmsTab==='theme')renderCMS();toast('Theme: '+PRESETS[next].name)}
  else if(act==='copy-email')copyText(state.profile.email,'Email copied');
  else if(act==='toggle-item'){if(e.target.closest('.mini'))return;const k=a.dataset.k;openItems.has(k)?openItems.delete(k):openItems.add(k);a.parentElement.classList.toggle('open')}
  else if(act==='add'){const l=a.dataset.list;state[l].push(SCHEMA[l].blank());openItems.add(l+':'+(state[l].length-1));save();render();renderCMS()}
  else if(act==='del'){const l=a.dataset.list,i=+a.dataset.i;if(a.dataset.armed){state[l].splice(i,1);openItems.clear();save();render();renderCMS()}else{a.dataset.armed=1;a.style.color='#EF4444';a.style.borderColor='#EF4444';a.title='Click again to delete';toast('Click delete again to confirm');setTimeout(()=>{delete a.dataset.armed;a.style.color='';a.style.borderColor=''},2500)}}
  else if(act==='move'){const l=a.dataset.list,i=+a.dataset.i,j=i+ +a.dataset.d;if(j<0||j>=state[l].length)return;[state[l][i],state[l][j]]=[state[l][j],state[l][i]];openItems.clear();save();render();renderCMS()}
  else if(act==='smove'){const i=+a.dataset.i,j=i+ +a.dataset.d,s=state.sections;if(j<1||j>=s.length)return;[s[i],s[j]]=[s[j],s[i]];save();render();renderCMS()}
  else if(act==='img-clear'){getObj(a.dataset.path)[a.dataset.key]='';save();render();renderCMS()}
  else if(act==='reset-colors'){state.theme.overrides={};applyTheme();save();render();renderCMS()}
  else if(act==='msg-del'){state.inbox.splice(+a.dataset.i,1);save();renderCMS()}
  else if(act==='export')copyText(document.getElementById('exp').value,'JSON copied');
  else if(act==='import'){try{const d=JSON.parse(document.getElementById('imp').value);const base=DEFAULTS();state={...base,...d,theme:{...base.theme,...d.theme},profile:{...base.profile,...d.profile},copy:{...base.copy,...d.copy},inbox:state.inbox};applyTheme();save();render();renderCMS();toast('Content imported')}catch(err){toast('That JSON could not be read')}}
  else if(act==='reset-all'){if(a.dataset.armed){state=DEFAULTS();applyTheme();save();render();renderCMS();toast('Reset to defaults')}else{a.dataset.armed=1;a.textContent='Click again to confirm reset';setTimeout(()=>{delete a.dataset.armed;a.textContent='Reset everything to defaults'},3000)}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();closeCMS()}
  if(e.key==='Enter'&&e.target.matches('[data-proj]'))openProject(e.target.dataset.proj);
  if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('cms').classList.contains('open')?closeCMS():openCMS()}
});
const cmsBody=document.getElementById('cmsBody');
cmsBody.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.path&&el.dataset.type!=='image')setField(el);
  else if(el.dataset.color){state.theme.overrides[el.dataset.color]=el.value;applyTheme();save();scheduleRender()}
  else if(el.dataset.theme==='radius'){state.theme.radius=+el.value;document.querySelector('[data-out="radius"]').textContent=el.value+'px';applyTheme();save()}
  else if(el.dataset.slabel!==undefined){state.sections[+el.dataset.slabel].label=el.value;save();scheduleRender()}
});
cmsBody.addEventListener('change',async e=>{const el=e.target;
  if(el.dataset.type==='image'&&el.files[0]){try{getObj(el.dataset.path)[el.dataset.key]=await readImage(el.files[0],el.dataset.key==='avatar'?700:1200);save();render();renderCMS();toast('Image uploaded')}catch(err){toast('Could not read that image')}}
  else if(el.dataset.color)renderCMS();
  else if(el.dataset.theme==='font'){state.theme.font=el.value;applyTheme();save()}
  else if(el.dataset.theme==='animations'||el.dataset.theme==='showFab'){state.theme[el.dataset.theme]=el.checked;applyTheme();save()}
  else if(el.dataset.svis!==undefined){state.sections[+el.dataset.svis].visible=el.checked;save();render()}
});

/* ================= STARFIELD ================= */
const fx={on:true,colors:['#7C5CFF','#22D3EE','#fff'],pts:[]};
(function(){const cv=document.getElementById('fx'),ctx=cv.getContext('2d');let w,h,dpr;
  function size(){dpr=Math.min(2,devicePixelRatio||1);w=cv.width=innerWidth*dpr;h=cv.height=innerHeight*dpr;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
    fx.pts=Array.from({length:Math.round(innerWidth/14)},()=>({x:Math.random()*w,y:Math.random()*h,r:(Math.random()*1.4+.3)*dpr,v:(Math.random()*.25+.05)*dpr,c:Math.floor(Math.random()*3),t:Math.random()*6}))}
  size();addEventListener('resize',size);
  function tick(){ctx.clearRect(0,0,w,h);
    if(fx.on){const still=document.body.classList.contains('no-anim');
      for(const p of fx.pts){if(!still){p.y-=p.v;p.t+=.02;if(p.y<0){p.y=h;p.x=Math.random()*w}}
        ctx.globalAlpha=.25+Math.abs(Math.sin(p.t))*.5;ctx.fillStyle=fx.colors[p.c];ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}}
    requestAnimationFrame(tick)}
  tick()})();

/* ================= BOOT ================= */
load();applyTheme();render();
</script>
